<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ghar Meals</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2e7d32">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;background:#fafafa;color:#222;padding-bottom:80px}
main{max-width:640px;margin:0 auto;padding:12px}
h2{margin:8px 0 12px;font-size:20px}
h3{margin:16px 0 8px;font-size:16px;color:#555}
button{font:inherit;min-height:44px;min-width:44px;border:0;border-radius:10px;background:#e8e8e8;padding:8px 14px;cursor:pointer}
button.p{background:#2e7d32;color:#fff}
button.s{background:#fff;border:1px solid #ccc}
button:active{opacity:.7}
input,select,textarea{font:inherit;min-height:44px;border:1px solid #ccc;border-radius:10px;padding:8px 10px;background:#fff;width:100%}
input[type=checkbox]{width:28px;height:28px;min-height:0}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}
.row .g{flex:1}
.card{background:#fff;border:1px solid #e3e3e3;border-radius:14px;padding:12px;margin:10px 0}
.small{font-size:14px;color:#666}
.mr{font-size:15px;color:#444}
.done{opacity:.5;text-decoration:line-through}
.q{width:84px;text-align:center}
.bars{display:flex;gap:6px;align-items:flex-end;height:120px;margin:12px 0}
.bar{flex:1;background:#2e7d32;border-radius:6px 6px 0 0;min-height:2px}
.bar.t{background:#c8e6c9}
.lbl{display:flex;gap:6px}.lbl span{flex:1;text-align:center;font-size:12px;color:#666}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #ddd;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border-radius:0;background:none;min-height:56px;font-size:14px;color:#666}
nav button.on{color:#2e7d32;font-weight:600}
/* cook mode: big, Marathi */
.cook{font-size:22px;line-height:1.5}
.cook h2{font-size:28px}
.cook .step{padding:12px;border-radius:12px;margin:8px 0;background:#fff;border:1px solid #e3e3e3}
.cook .step.on{background:#fff8e1;border-color:#ffb300}
.cook button{font-size:22px;min-height:60px;flex:1}
.cook li{margin:4px 0}
.hidden{display:none}
</style>
</head>
<body>
<main id="app"></main>
<nav>
<button data-tab="stock">Stock</button>
<button data-tab="plan">Plan</button>
<button data-tab="cook">स्वयंपाक</button>
<button data-tab="stats">Stats</button>
<button data-tab="set">⚙</button>
</nav>
<script type="module" src="app.js"></script>
</body>
</html>
